<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="js/services/auth.js?v=1"></script>
    <script>
        // Sessione gia' attiva: salta il login e vai diretto all'app
        (function () {
            try {
                if (typeof Auth !== "undefined" && Auth.getUser()) {
                    window.location.replace("index.html");
                }
            } catch (e) {}
        })();
    </script>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet/less" href="less/login.less?v=8" />
    <script src="less/less.js"></script>
</head>
<body>
    <!-- Login form -->
    <div id="loginCard" class="card confirm-dialog show" autocomplete="off">
        <h4 id="t">Login</h4>
        <div id="loginForm">
        <div class="f-group"><input type="text" id="u" placeholder="User" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" list="userList" readonly><datalist id="userList"></datalist></div>
        <div class="f-group">
            <input type="password" id="p" placeholder="Pass" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" readonly>
            <div class="eye" onclick="togglePw('p')">&#128065;</div>
        </div>
        <div id="s" style="display:none" class="f-group">
            <input type="password" id="p2" placeholder="Conferma" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" readonly>
            <div class="eye" onclick="togglePw('p2')">&#128065;</div>
        </div>
        <button id="b" class="ok" type="button">Accedi</button>
        <div id="err" class="err"></div>
        </div>
        <div class="toggle" id="x">Non hai un account? <span>Registrati</span></div>
    </div>
    <script>
        let mode = false;

        function togglePw(id) {
            const input = document.getElementById(id);
            if (!input) return;
            input.type = input.type === "password" ? "text" : "password";
            input.focus();
        }

        async function refreshUserList() {
            const list = document.getElementById("userList");
            if (!list) return;
            list.innerHTML = "";
            const names = await Auth.listUsers();
            for (const name of names) {
                const opt = document.createElement("option");
                opt.value = name;
                list.appendChild(opt);
            }
        }

        function showError(msg) {
            const el = document.getElementById("err");
            el.innerText = msg;
            el.style.display = "block";
        }
        function hideError() { document.getElementById("err").style.display = "none"; }

        function showWelcome(data) {
            var payload = JSON.stringify(data);
            sessionStorage.setItem("authResult", payload);
            sessionStorage.setItem("authSession", payload);
            window.location.replace("index.html");
        }

        const userInput = document.getElementById("u");
        const passInput = document.getElementById("p");
        const pass2Input = document.getElementById("p2");

        refreshUserList();

        // Solo i nostri registrati sul campo user (datalist da IndexedDB), nulla
        // sulle password in login e registrazione. I campi nascono readonly
        // (il browser non riempie i readonly e non mostra suggerimenti) e si
        // sbloccano al focus manuale. Le password si ribloccano al blur (non
        // hanno datalist, quindi e' sicuro); lo user resta sbloccato dopo il
        // primo focus per non rompere la scelta col mouse dalla lista.
        [userInput, passInput, pass2Input].forEach(function (el) {
            el.addEventListener("focus", function () { el.removeAttribute("readonly"); });
        });
        [passInput, pass2Input].forEach(function (el) {
            el.addEventListener("blur", function () { el.setAttribute("readonly", ""); });
        });
        userInput.addEventListener("input", function (ev) {
            if (ev && ev.inputType === "insertReplacementText") {
                passInput.value = "";
                pass2Input.value = "";
            }
        });
        userInput.addEventListener("change", function () {
            passInput.value = "";
            pass2Input.value = "";
        });

        document.getElementById("x").onclick = () => {
            mode = !mode;
            hideError();
            document.getElementById("t").innerText = mode ? "Registrazione" : "Login";
            document.getElementById("b").innerText = mode ? "Registrati" : "Accedi";
            document.getElementById("s").style.display = mode ? "block" : "none";
            pass2Input.value = ""; pass2Input.type = "password";
            document.getElementById("x").innerHTML = mode
                ? "Annulla? <span>Torna al Login</span>"
                : "Non hai un account? <span>Registrati</span>";
        };

        document.getElementById("b").addEventListener("click", submitLogin);
        [userInput, passInput, pass2Input].forEach(function (el) {
            el.addEventListener("keydown", function (ev) {
                if (ev.key === "Enter") { ev.preventDefault(); submitLogin(); }
            });
        });

        async function submitLogin() {
            hideError();
            const user = userInput.value.trim();
            const pass = passInput.value;
            if (!user || !pass) return;
            if (mode) {
                if (pass !== pass2Input.value) { showError("Le password non corrispondono"); return; }
                const result = await Auth.signup(user, pass);
                if (result === "already") { showError("User gia' registrato"); return; }
                Auth.kill();
                showWelcome(user);
            } else {
                const data = await Auth.login(user, pass);
                if (!data) { showError("Credenziali errate"); return; }
                Auth.kill();
                showWelcome(data);
            }
        }
    </script>
</body>
</html>
