<!DOCTYPE html>
<html lang="it">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login - agnochat</title>
        <link rel="icon" href="favicon.ico" type="image/x-icon">
        <style>
            body {
                background: #0a0a0a;
                color: #e0e0e0;
                font-family: sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
            }

            .card {
                background: #1e1e1e;
                padding: 64px 72px;
                border-radius: 12px;
                border: 1px solid #333;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
                text-align: center;
                min-width: 420px;
            }

            .card h2 {
                color: #f5f5f5;
                font-size: 2.5em;
                font-weight: 500;
                letter-spacing: 0.02em;
                margin: 0 0 16px 0;
            }

            .card p {
                color: #9e9e9e;
                font-size: 1.05em;
            }
        </style>
    </head>

    <body>
        <div class="card">
            <h2>agnochat</h2>
            <p>Accedi con Google</p>
            <div id="g_signin"></div>
        </div>

        <script src="https://accounts.google.com/gsi/client" async defer></script>
        <script>
            const CLIENT_ID = '387282319504-snlehr8cirvenc82hrpso9pipf3f3qds.apps.googleusercontent.com';

            // Utilizzo di una moderna arrow function per gestire la risposta
            const handleGoogleResponse = (r) => {
                const payload = r.credential.split('.')[1];
                const decoded = JSON.parse(atob(payload.replace(/-/g, '+').replace(/_/g, '/')));
                localStorage.setItem('user_web_id', decoded.email);
                window.location.replace('index.html');
            };

            window.onload = () => {
                google.accounts.id.initialize({ client_id: CLIENT_ID, callback: handleGoogleResponse });
                google.accounts.id.renderButton(document.getElementById("g_signin"), { theme: "filled_blue", size: "large" });
            };
        </script>
    </body>

</html>
