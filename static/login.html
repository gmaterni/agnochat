<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="js/services/auth.js"></script>
    <script>
        // Sessione gia' attiva: salta il login e vai diretto all'app
        (function () {
            try {
                if (typeof Auth !== "undefined" && Auth.getUser()) {
                    window.location.replace("index.html");
                }
            } catch (e) {}
        })();
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: #1e1e1e;
            padding: 40px 32px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            width: 360px;
            text-align: center;
        }
        .card h2 {
            color: #82b1ff;
            font-weight: 500;
            font-size: 1.6em;
            margin-bottom: 28px;
            letter-spacing: 0.5px;
        }
        .f-group { position: relative; width: 100%; }
        input {
            width: 100%;
            padding: 14px 16px;
            margin: 8px 0;
            background: #2c2c2c;
            border: 1px solid #3c3c3c;
            border-radius: 8px;
            color: #fff;
            font-size: 1em;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            transition: border-color 0.2s, box-shadow 0.2s;
            padding-right: 44px;
        }
        input:focus {
            outline: none;
            border-color: #82b1ff;
            box-shadow: 0 0 0 2px rgba(130,177,255,0.25);
        }
        input::placeholder { color: #707070; }
        button {
            width: 100%;
            padding: 14px;
            background: #82b1ff;
            border: none;
            border-radius: 8px;
            color: #121212;
            cursor: pointer;
            margin-top: 16px;
            font-size: 1.1em;
            font-weight: 700;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            letter-spacing: 0.5px;
            transition: background 0.2s, box-shadow 0.2s;
        }
        button:hover { background: #a0c4ff; box-shadow: 0 4px 12px rgba(130,177,255,0.3); }
        .toggle {
            margin-top: 20px;
            font-size: 0.85em;
            color: #888;
            cursor: pointer;
            transition: color 0.2s;
        }
        .toggle:hover { color: #b0b0b0; }
        .toggle span {
            color: #82b1ff;
            font-weight: 700;
            cursor: pointer;
        }
        .eye {
            position: absolute;
            right: 12px;
            top: 18px;
            cursor: pointer;
            color: #666;
            font-size: 0.9em;
            user-select: none;
            transition: color 0.2s;
        }
        .eye:hover { color: #aaa; }
        .err {
            color: #ff5252;
            font-size: 0.85em;
            margin-top: 10px;
            display: none;
            font-weight: 500;
        }
        .pwd { letter-spacing: 3px; }
        .trap { position: absolute; left: -9999px; top: -9999px; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
        /* Welcome */
        .welcome h1 { color: #82b1ff; font-weight: 500; font-size: 1.6em; margin-bottom: 16px; }
        .welcome p { color: #b0b0b0; margin-bottom: 8px; }
        .welcome b { color: #82b1ff; font-weight: 700; }
        .logout {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 32px;
            background: transparent;
            border: 1px solid #82b1ff;
            border-radius: 8px;
            color: #82b1ff;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95em;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        .logout:hover { background: #82b1ff; color: #121212; }
        .json {
            text-align: left;
            background: #2c2c2c;
            border: 1px solid #3c3c3c;
            border-radius: 8px;
            padding: 14px;
            margin: 16px 0;
            font-size: 0.72em;
            color: #b0b0b0;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 260px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <!-- Login form -->
    <div id="loginCard" class="card" autocomplete="off">
        <h2 id="t">Login</h2>
        <input class="trap" type="text" name="username" autocomplete="username" tabindex="-1" aria-hidden="true">
        <input class="trap" type="password" name="password" autocomplete="current-password" tabindex="-1" aria-hidden="true">
        <div class="f-group"><input type="text" id="u" name="app-user-no-autofill" placeholder="User" autocomplete="app-user-no-autofill" autocapitalize="off" autocorrect="off" spellcheck="false" list="userList" readonly data-lpignore="true" data-1p-ignore data-bwignore><datalist id="userList"></datalist></div>
        <div class="f-group">
            <input type="text" id="p" class="pwd" name="app-pass-no-autofill" placeholder="Pass" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" readonly data-lpignore="true" data-1p-ignore data-bwignore>
            <div class="eye" onclick="v('p')">&#128065;</div>
        </div>
        <div id="s" style="display:none" class="f-group">
            <input type="text" id="p2" class="pwd" name="app-pass2-no-autofill" placeholder="Conferma" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" readonly data-lpignore="true" data-1p-ignore data-bwignore>
            <div class="eye" onclick="v('p2')">&#128065;</div>
        </div>
        <button id="b">Accedi</button>
        <div id="err" class="err"></div>
        <div class="toggle" id="x">Non hai un account? <span>Registrati</span></div>
    </div>
    <!-- Welcome (nascosto, mostrato dopo login) -->
    <div id="welcomeCard" class="card welcome" style="display:none">
        <h1>Benvenuto</h1>
        <p>ID Utente: <b id="wUser"></b></p>
        <pre id="wJson" class="json"></pre>
        <button class="logout" onclick="doLogout()">Logout</button>
    </div>
    <script>
        let mode = false;
        const BULLET = "\u2022";
        const PasswordStore = { p: "", p2: "" };

        function v(id) {
            if (id !== "p" && id !== "p2") return;
            const input = document.getElementById(id);
            if (!input) { console.error("v: campo non trovato"); return; }
            const showing = input.dataset.show === "1";
            const real = id === "p" ? PasswordStore.p : PasswordStore.p2;
            if (showing) {
                input.dataset.show = "0";
                input.value = BULLET.repeat(real.length);
            } else {
                input.dataset.show = "1";
                input.value = real;
            }
            try { input.setSelectionRange(input.value.length, input.value.length); } catch (e) {}
            input.focus();
        }

        function bindPasswordMask(input) {
            if (!input) return;
            input.dataset.show = "0";
            const moveEnd = () => { try { input.setSelectionRange(input.value.length, input.value.length); } catch (e) {} };
            input.addEventListener("click", moveEnd);
            input.addEventListener("keydown", (ev) => {
                if (input.dataset.show === "1") return;
                if (ev.key === "ArrowLeft" || ev.key === "ArrowRight" || ev.key === "Home") { ev.preventDefault(); moveEnd(); }
                if ((ev.ctrlKey || ev.metaKey) && ev.key === "a") { ev.preventDefault(); moveEnd(); }
            });
            input.addEventListener("input", () => {
                if (input.dataset.show === "1") {
                    if (input.id === "p") PasswordStore.p = input.value;
                    else PasswordStore.p2 = input.value;
                    return;
                }
                const oldReal = input.id === "p" ? PasswordStore.p : PasswordStore.p2;
                const displayed = input.value;
                let next = "";
                if (displayed.length < oldReal.length) {
                    next = oldReal.slice(0, displayed.length);
                } else {
                    const added = displayed.split("").filter(c => c !== BULLET).join("");
                    const keepLen = displayed.length - added.length;
                    next = oldReal.slice(0, keepLen) + added;
                }
                if (input.id === "p") PasswordStore.p = next;
                else PasswordStore.p2 = next;
                input.value = BULLET.repeat(next.length);
                moveEnd();
            });
        }

        async function refreshUserList() {
            const list = document.getElementById("userList");
            if (!list) return;
            list.innerHTML = "";
            const names = await Auth.listUsers();
            for (const name of names) {
                const opt = document.createElement("option");
                opt.value = name;
                list.appendChild(opt);
            }
        }

        function unlockOnInteract(input, refresh) {
            const unlock = async () => {
                input.removeAttribute("readonly");
                if (refresh) await refreshUserList();
            };
            input.addEventListener("focus", unlock);
            input.addEventListener("click", unlock);
        }

        function showError(msg) {
            const el = document.getElementById("err");
            el.innerText = msg;
            el.style.display = "block";
        }
        function hideError() { document.getElementById("err").style.display = "none"; }

        function showWelcome(data) {
            var payload = JSON.stringify(data);
            sessionStorage.setItem("authResult", payload);
            sessionStorage.setItem("authSession", payload);
            window.location.replace("index.html");
        }

        function showLogin() {
            PasswordStore.p = ""; PasswordStore.p2 = "";
            userInput.value = ""; passInput.value = ""; pass2Input.value = "";
            passInput.dataset.show = "0"; pass2Input.dataset.show = "0";
            mode = false;
            document.getElementById("t").innerText = "Login";
            document.getElementById("b").innerText = "Accedi";
            document.getElementById("s").style.display = "none";
            document.getElementById("x").innerHTML = "Non hai un account? <span>Registrati</span>";
            hideError();
            document.getElementById("welcomeCard").style.display = "none";
            document.getElementById("loginCard").style.display = "block";
        }

        const userInput = document.getElementById("u");
        const passInput = document.getElementById("p");
        const pass2Input = document.getElementById("p2");
        bindPasswordMask(passInput);
        bindPasswordMask(pass2Input);

        PasswordStore.p = ""; PasswordStore.p2 = "";
        userInput.value = ""; passInput.value = ""; pass2Input.value = "";
        setTimeout(() => {
            PasswordStore.p = ""; PasswordStore.p2 = "";
            userInput.value = ""; passInput.value = ""; pass2Input.value = "";
        }, 150);

        refreshUserList();
        unlockOnInteract(userInput, true);
        unlockOnInteract(passInput, false);
        unlockOnInteract(pass2Input, false);

        document.getElementById("x").onclick = () => {
            mode = !mode;
            hideError();
            document.getElementById("t").innerText = mode ? "Registrazione" : "Login";
            document.getElementById("b").innerText = mode ? "Registrati" : "Accedi";
            document.getElementById("s").style.display = mode ? "block" : "none";
            PasswordStore.p2 = ""; pass2Input.dataset.show = "0"; pass2Input.value = "";
            document.getElementById("x").innerHTML = mode
                ? "Annulla? <span>Torna al Login</span>"
                : "Non hai un account? <span>Registrati</span>";
        };

        document.getElementById("b").onclick = async () => {
            hideError();
            const user = userInput.value.trim();
            const pass = PasswordStore.p;
            if (!user || !pass) return;
            if (mode) {
                if (pass !== PasswordStore.p2) { showError("Le password non corrispondono"); return; }
                const result = await Auth.signup(user, pass);
                if (result === "already") { showError("User gia' registrato"); return; }
                Auth.kill(); PasswordStore.p = ""; PasswordStore.p2 = "";
                showWelcome(user);
            } else {
                const data = await Auth.login(user, pass);
                if (!data) { showError("Credenziali errate"); return; }
                Auth.kill(); PasswordStore.p = ""; PasswordStore.p2 = "";
                showWelcome(data);
            }
        };

        function doLogout() {
            Auth.kill();
            showLogin();
        }
    </script>
</body>
</html>
