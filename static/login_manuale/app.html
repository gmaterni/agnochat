<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: #1e1e1e;
            padding: 40px 32px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            width: 560px;
            text-align: center;
        }
        .card h1 {
            color: #82b1ff;
            font-weight: 500;
            font-size: 1.5em;
            margin-bottom: 6px;
        }
        .card .user {
            color: #b0b0b0;
            font-size: 0.9em;
            margin-bottom: 20px;
        }
        .card .user b { color: #82b1ff; font-weight: 700; }
        .json {
            text-align: left;
            background: #2c2c2c;
            border: 1px solid #3c3c3c;
            border-radius: 8px;
            padding: 14px;
            margin: 0 0 20px 0;
            font-size: 0.72em;
            color: #b0b0b0;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 320px;
            overflow-y: auto;
        }
        .json .key { color: #82b1ff; }
        .json .str { color: #c3e88d; }
        .json .bool { color: #ff5370; }
        .json .num { color: #f78c6c; }
        .logout {
            display: inline-block;
            padding: 12px 32px;
            background: transparent;
            border: 1px solid #82b1ff;
            border-radius: 8px;
            color: #82b1ff;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95em;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        .logout:hover { background: #82b1ff; color: #121212; }
        .no-data { color: #666; font-size: 0.95em; }
    </style>
</head>
<body>
    <div class="card" id="panel" style="display:none">
        <h1>Benvenuto</h1>
        <p class="user">ID Utente: <b id="wUser"></b></p>
        <pre class="json" id="wJson"></pre>
        <button class="logout" onclick="doLogout()">Logout</button>
    </div>
    <p class="no-data" id="noData">Nessun dato di login. Reindirizzamento...</p>
    <script src="auth.js"></script>
    <script>
        (function () {
            const raw = sessionStorage.getItem("authResult");
            if (!raw) {
                window.location.replace("login.html");
                return;
            }
            sessionStorage.removeItem("authResult");
            let data;
            try {
                data = JSON.parse(raw);
            } catch (e) {
                window.location.replace("login.html");
                return;
            }
            document.getElementById("wUser").innerText = data.username || "sconosciuto";
            document.getElementById("wJson").innerHTML = highlightJson(data);
            document.getElementById("panel").style.display = "block";
            document.getElementById("noData").style.display = "none";
        })();

        function highlightJson(obj) {
            const json = JSON.stringify(obj, null, 2);
            return json
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"([^"]+)":/g, '<span class="key">"$1"</span>:')
                .replace(/: "([^"]*)"/g, ': <span class="str">"$1"</span>')
                .replace(/: (true|false)/g, ': <span class="bool">$1</span>')
                .replace(/: (\d+)/g, ': <span class="num">$1</span>');
        }

        function doLogout() {
            sessionStorage.removeItem("authResult");
            window.location.replace("login.html");
        }
    </script>
</body>
</html>
